[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almond-axol"
version = "0.1.36"
description = "Almond Axol SDK"
license = { text = "MIT" }
readme = "README.md"
# 3.12 floor so `pip install lerobot[almond_axol]` works everywhere LeRobot
# does (LeRobot supports 3.12); our own installs and dev stay on 3.13 via
# .python-version and the install script.
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.9", # WebRTC transport for headset camera video (pulls av)
    "draccus>=0.11.6,<0.12",
    "fastapi>=0.135.2",
    "jax>=0.9.2",
    "jaxlie>=1.5.0",
    "mujoco>=3.8.0",
    "pydantic>=2.12.5",
    # Our PyPI-published fork of pyroki (github.com/almond-bot-research/pyroki,
    # `almond` branch), which installs the `pyroki` import name. Upstream has no
    # PyPI release and pins jaxls from git, which PyPI rejects in dependency
    # metadata — the fork (and its almond-jaxls companion) is what makes
    # almond-axol itself installable from PyPI.
    "almond-pyroki>=0.1.0",
    "python-can>=4.6.1",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.42.0",
    "yourdfpy>=0.0.60",
    "opencv-python-headless>=4.13.0.92"
]

[project.optional-dependencies]
gamepad = ["pygame>=2.6"]
# Floor 0.6.1: the bindings use lerobot.lerobot_types + the VideoEncoderConfig
# API (both landed in 0.6.1). Our own installs pin the exact rev via
# [tool.uv.sources]; the floor protects plain-pip consumers (e.g. the
# lerobot_robot_axol plugin) resolving lerobot from PyPI.
lerobot = ["lerobot[dataset,viz,async]>=0.6.1"]
sim = ["viser>=1.0.24"]

[project.scripts]
axol = "almond_axol.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["almond_axol"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=almond_axol",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["almond_axol"]
omit = [
    "almond_axol/lerobot/*",
]

[tool.coverage.report]
fail_under = 30
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
