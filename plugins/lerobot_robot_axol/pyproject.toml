[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_robot_axol"
version = "0.1.0"
description = "LeRobot plugin for the Almond Axol dual-arm robot: robot `axol`, VR teleoperator `axol_vr`, camera `zed`."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
# Direct git reference: almond-axol has no PyPI release, so carrying the URL in
# the metadata makes `pip install "lerobot_robot_axol @ git+...#subdirectory=..."`
# a one-command install. Swap to a plain versioned dependency if/when
# almond-axol is published to PyPI.
dependencies = ["almond-axol[lerobot] @ git+https://github.com/almond-bot/axol"]

[project.urls]
Homepage = "https://docs.almond.bot"
Repository = "https://github.com/almond-bot/axol"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_axol"]

# Required for the almond-axol direct git reference in [project.dependencies].
[tool.hatch.metadata]
allow-direct-references = true
