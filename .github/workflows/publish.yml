# Publish almond-axol and lerobot_robot_axol to PyPI on every published
# GitHub release, via PyPI trusted publishing (OIDC) — no tokens or secrets
# required.
#
# The two packages publish from separate jobs with distinct environment
# claims: PyPI *pending* publishers are unique on (owner, repo, workflow,
# environment) — the project name is not part of the key — so two projects
# cannot both register against identical claims (pypi/warehouse#16920).
#
# One-time PyPI setup (org owner): on the organization's Publishing page
# (https://pypi.org/manage/organization/<org>/publishing/), add two pending
# publishers, both with owner `almond-bot`, repository `axol`, workflow
# `publish.yml`:
#   - project `almond-axol`, environment blank
#   - project `lerobot_robot_axol`, environment `pypi-plugin`
# The first release after that creates the PyPI projects owned by the
# organization. (The `pypi-plugin` GitHub environment is created automatically
# the first time the job runs; it needs no configuration.)
#
# The published almond-axol version is whatever `version` in pyproject.toml
# says at the release tag — the release flow already bumps it per release.
# The plugin's version lives in plugins/lerobot_robot_axol/pyproject.toml and
# only needs bumping when the plugin itself changes (skip-existing keeps
# unbumped re-uploads harmless).
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Ship the built web UI inside the wheel, so the installed `axol serve`
      # (axol.service) hosts the control panel and VR app itself. It is
      # staged into almond_axol/serve/ui, a gitignored hatch artifact (see
      # pyproject.toml). Building from the release checkout bakes the tag's
      # commit and version into the bundle.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Stage web UI into the package
        run: |
          rm -rf almond_axol/serve/ui
          cp -R web/app/dist almond_axol/serve/ui
      - run: uv build
      - name: Check the wheel ships the web UI
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          if "almond_axol/serve/ui/index.html" not in names:
              sys.exit(f"{wheel} is missing almond_axol/serve/ui/index.html")
          EOF
      # The offline bundle job ships this exact wheel (with the web UI).
      - uses: actions/upload-artifact@v4
        with:
          name: almond-axol-dist
          path: dist/
          if-no-files-found: error
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Offline update bundle for robots on networks with no internet access:
  # the release wheel, every locked dependency, the prebuilt axol-rt core,
  # PyGObject's sources and the pinned camera/tracker sources, attached to the
  # GitHub release as axol-offline-v<version>-linux-aarch64.tar (see
  # almond_axol/offline_bundle.py and scripts/build_offline_bundle.py).
  #
  # Built on Ubuntu 22.04 arm64 so pip picks wheels, and the axol-rt binary
  # links, for glibc 2.35: JetPack 6 hosts run jammy, and JetPack 7 and
  # Raspberry Pi OS are newer.
  offline-bundle:
    needs: publish-sdk
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    permissions:
      contents: write # upload the bundle to the release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: almond-axol-dist
          path: dist
      - name: Build axol-rt
        working-directory: rust/axol-rt
        run: cargo build --release --locked
      - name: Build the offline bundle
        run: |
          uv python install 3.13
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            uv run --no-project --python 3.13 --with pip \
            python scripts/build_offline_bundle.py \
              --wheel dist/almond_axol-*.whl \
              --rt-binary rust/axol-rt/target/release/axol-rt \
              --uv "$(command -v uv)" \
              --out "$RUNNER_TEMP/offline"
      # Prepare a container like a provisioned robot (uv, Python 3.13 under
      # /opt/axol, the apt packages provisioning installs), then install and
      # exercise the bundle with the network off.
      - name: Test the bundle with no network
        run: |
          bundle="$(find "$RUNNER_TEMP/offline" -mindepth 1 -maxdepth 1 -type d)"
          cp "$(command -v uv)" "$RUNNER_TEMP/uv"
          docker build -t axol-offline-test -f - "$RUNNER_TEMP" <<'EOF'
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates curl git gcc pkg-config libcap2-bin \
                libgirepository1.0-dev gobject-introspection libcairo2-dev \
              && rm -rf /var/lib/apt/lists/*
          COPY uv /usr/local/bin/uv
          RUN UV_PYTHON_INSTALL_DIR=/opt/axol/uv/python uv python install 3.13
          EOF
          docker run --rm --network none \
            -v "$bundle:/bundle:ro" \
            -v "$PWD/scripts/offline_bundle_smoke.sh:/smoke.sh:ro" \
            axol-offline-test bash /smoke.sh /bundle
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$RUNNER_TEMP"/offline/*.tar "$RUNNER_TEMP"/offline/*.tar.sha256 \
            --clobber

  publish-plugin:
    runs-on: ubuntu-latest
    # Distinct OIDC environment claim; see the header comment.
    environment: pypi-plugin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --project plugins/lerobot_robot_axol
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: plugins/lerobot_robot_axol/dist
          skip-existing: true
