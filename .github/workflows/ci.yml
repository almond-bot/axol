name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    # aarch64, like the Jetson hosts the package ships to. The test suite needs
    # the `lerobot` extra (several modules import it at module level), and the
    # x86_64 torch wheel drags in ~3.5 GB of CUDA libraries the tests never use;
    # the aarch64 wheel from the same lock is a 150 MB CPU build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.13 and locked dependencies
        run: |
          uv python install 3.13
          uv sync --locked --extra sim --extra lerobot --dev
      - name: Lint and format check
        run: |
          uvx --from ruff==0.9.7 ruff check .
          uvx --from ruff==0.9.7 ruff format --check .
      - name: Generate native expectations from the pinned independent reference solver
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          PYTHONPATH: .
        run: |
          # The independent numerical reference is bundled with its assets
          # and licenses, so replay requires no external source checkout.
          reference_root="$RUNNER_TEMP/mink-reference-source"
          native_fixture="$RUNNER_TEMP/mink-reference-native"
          mkdir -p "$reference_root"
          echo "a3a5095000f6be84db92efc880cbe7f723f4cc0d3710bf145cfac0c1bada2642  tests/data/mink_ik_reference/reference-source.tar.gz" | sha256sum --check
          tar -xzf tests/data/mink_ik_reference/reference-source.tar.gz -C "$reference_root"
          # Verify every reference source/asset hash before import, replay the
          # frozen inputs, then compare reference and production output exactly on this CPU.
          uv run --no-sync python tests/tools/mink_ik_reference.py \
            --reference-root "$reference_root/mink_reference" \
            --replay-fixture --write-fixture "$native_fixture"
          echo "AXOL_MINK_REFERENCE_FIXTURE=$native_fixture" >> "$GITHUB_ENV"
      # The IK tests spend most of their time in XLA compiles. JAX keeps them in
      # ~/.almond/jax-cache (almond_axol/kinematics/jax_cache.py), keyed by the
      # graph and the jax version, so a stale entry is never reused. Restore the
      # newest cache saved by main for this lock; only main saves, so PRs read
      # it without each adding a copy.
      - name: Restore JAX compilation cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.almond/jax-cache
          key: jax-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}-
      - name: Unit and integration tests
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        # One worker per vCPU. loadscope keeps each test class on one worker,
        # so a class's setUpClass (an IK solver build) runs once.
        run: uv run --no-sync pytest -n auto --dist loadscope --junitxml=pytest.xml
      - name: Save JAX compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.almond/jax-cache
          key: jax-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
      - name: Build distributable packages
        run: |
          uv build
          uv build --project plugins/lerobot_robot_axol
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-report
          path: pytest.xml
          if-no-files-found: ignore
      - name: Upload native numerical reference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mink-reference-native-reference
          path: ${{ runner.temp }}/mink-reference-native
          if-no-files-found: ignore

  rust:
    name: Rust realtime core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust/axol-rt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Unit tests and independent tracking vectors
        run: cargo test --locked

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Format and lint
        run: |
          npm run format:check
          npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Production build and type check
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
